title: "[卜卦問事] "
labels: ["horary", "help-wanted", "ai-review"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🔮 古典占星卜卦與命盤求助 (Q&A)
        歡迎在此提交你的卜卦盤或命盤問題！AI（William Lilly 1647 原典體系）將在發布後自動為你進行盤體檢意與成事診斷。
  - type: input
    id: question
    attributes:
      label: ❓ 具體問題 (Question)
      description: 請清楚描述想要問卜的具體事項（例如：下週的面試會錄取嗎？、我與對方有機會復合嗎？）
      placeholder: "例如：下週的面試會錄取嗎？"
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 📖 事件背景與當前處境 (Context)
      description: 簡要說明現實背景、人際關係或目前進展，有助於更精確鎖定代表宮位與徵象星。
      placeholder: "簡述現實背景..."
    validations:
      required: false
  - type: textarea
    id: chart_data
    attributes:
      label: 🪐 命盤星體數據 (Chart Data)
      description: 可直接貼上由排盤系統產生的星體度數表，或填寫起卦時間、地點、上升度數。
      placeholder: "起卦時間 (UTC/當地時)、地點、上升星座度數、各星體度數表..."
    validations:
      required: true
