name: 🏛️ 古典本命與推運研討 (Natal & Predictive Studies)
description: 提交本命盤格局、全盤總御星、法達/黃道釋放/太陽弧等推運案例
title: "[本命推運] "
labels: ["natal", "predictive", "study"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🏛️ 古典本命與綜合推運研討
        歡迎分享經典名性格局、個人本命難題或推運研究案例。
  - type: input
    id: study_theme
    attributes:
      label: 🎯 研究主題 (Theme)
      description: 本次研討的焦點（例如：全盤總御星天賦、ZR 精神點 L2 換宮轉折、太陽弧合天頂引動）
      placeholder: "例如：黃道釋放精神點 L2 巔峰期職涯驗證"
    validations:
      required: true
  - type: textarea
    id: chart_summary
    attributes:
      label: 🪐 命盤結構與推運參數 (Chart & Predictive Data)
      description: 貼上由排盤系統產生的本命盤、法達星限或推運摘要數據。
      placeholder: "本命整宮制配置、推運時間軸數據..."
    validations:
      required: true
  - type: textarea
    id: discussion_points
    attributes:
      label: 💡 想要探討的疑問或心得 (Discussion Points)
      description: 具體分享你的觀察、推論或想向社群朋友請教的問題。
      placeholder: "請詳述你的分析觀點與問題..."
    validations:
      required: true
