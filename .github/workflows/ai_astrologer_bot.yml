name: AI Astrologer Community Bot

on:
  discussion:
    types: [created]
  discussion_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      test_title:
        description: 'Test Discussion Title'
        required: false
        default: '[卜卦測試] 這份工作能順利拿到 Offer 嗎？'
      test_body:
        description: 'Test Discussion Body'
        required: false
        default: '上升天蠍 14°，10 宮主太陽落在雙子座 12°，1 宮主火星在金牛座 20° 逆行。請 AI 掌門體檢。'

permissions:
  contents: read
  discussions: write

jobs:
  ai_reply:
    runs-on: ubuntu-latest
    # 當是新 Discussion 建立，或者有人在留言中 @ai-astrologer, @ai, @AI, @bot 且非機器人自身留言時觸發
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'discussion' ||
      (
        github.event_name == 'discussion_comment' &&
        github.event.comment.user.login != 'github-actions[bot]' &&
        (
          contains(github.event.comment.body, '@ai-astrologer') ||
          contains(github.event.comment.body, '@ai') ||
          contains(github.event.comment.body, '@AI') ||
          contains(github.event.comment.body, '@bot') ||
          contains(github.event.comment.body, '@groq')
        )
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Bot Dependencies
        run: |
          pip install --upgrade pip
          pip install groq requests

      - name: Run AI Astrologer Bot
        env:
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCUSSION_ID: ${{ github.event.discussion.node_id }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title || github.event.inputs.test_title }}
          DISCUSSION_BODY: ${{ github.event.discussion.body || github.event.inputs.test_body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_NODE_ID: ${{ github.event.comment.node_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python scripts/forum_ai_bot.py
